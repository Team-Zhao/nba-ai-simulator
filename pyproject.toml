[project]
name = "nba-ai-simulator"
version = "1.0.0"
description = "NBA game prediction system using player ratings, team features, and machine learning"
readme = "README.md"
authors = [
    { name = "Michael Zhao", email = "muqingzhao526@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "nba-api>=1.11.4",
    "numpy>=2.5.3",
    "openai>=3.24.0",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]

[project.scripts]
nba-ai-simulator = "nba_ai_simulator:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
